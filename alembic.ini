# Alembic Configuration
# ============================================================
# This file is read by `alembic` CLI commands.
# Do NOT put secrets here — values come from .env via env.py.
# ============================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Naming convention for auto-generated migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Output encoding
output_encoding = utf-8

# SQLAlchemy URL is set dynamically in env.py — leave blank here
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
